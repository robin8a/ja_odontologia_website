version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm --prefix web ci --cache .npm --prefer-offline
    build:
      commands:
        - npm --prefix web run build
  artifacts:
    baseDirectory: web/.next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - web/node_modules/**/*
      - web/.next/cache/**/*
